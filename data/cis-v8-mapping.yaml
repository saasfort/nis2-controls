$schema: https://saasfort.com/schemas/nis2-control-library-v1.json
title: SaaSFort CIS Controls v8 Mapping
source: Center for Internet Security Critical Security Controls v8.1 — externally-observable safeguards only
generated_at: '2026-05-02T00:00:00Z'
license: MIT
repository: https://github.com/saasfort/nis2-controls
scope_note: CIS Controls v8 contains 18 top-level controls and 153 safeguards. This file maps only the controls whose safeguards have an externally-observable component. Internal controls (e.g. CIS-08 Audit
  Log Management, CIS-10 Malware Defenses, CIS-11 Data Recovery) are intentionally omitted because no external scanner can verify them.
controls:
- control: CIS-01
  title: Inventory and Control of Enterprise Assets
  implementation_groups:
  - IG1
  - IG2
  - IG3
  checks:
  - Active subdomains
  - CT log query
  - CT log subdomain enumeration
  - Common subdomain enumeration
  - DNS zone transfer
  - MX records
  - Nameservers
  - Stale subdomain detection
  - Subdomain security posture
  evidence_types:
  - Asset inventory export with last-seen timestamps
  - External attack-surface report
  - DNS zone register
  - Reconciliation log against authoritative inventory
- control: CIS-02
  title: Inventory and Control of Software Assets
  implementation_groups:
